[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-prospecta"
version = "0.1.0"
description = "Prospecta memory provider plugin for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge ⚒️", email = "forge@witt3rd.com" }]
requires-python = ">=3.11"
dependencies = [
    # Pinned to main@edefe3e (schema migration 0003, env-selectable embedder); the
    # v0.1.0 tag predates both (the live bank DB is already at schema version 3).
    # [defaults] = LiteLLM (LLM + default embedder); [embed-sentence-transformers]
    # is declared here, not optional, so a venv rebuild cannot drop the local embedder.
    "prospecta[defaults,embed-sentence-transformers] @ git+https://github.com/witt3rd/prospecta.git@e863ac1c7a8f291205564d24b1aa039d6c70df80",
    "psycopg[binary]>=3.1",
]

[project.scripts]
hermes-prospecta-health = "health:main"
hermes-prospecta-backup = "backup:backup_main"
hermes-prospecta-restore = "backup:restore_main"

[project.optional-dependencies]
test = ["pytest>=7", "testcontainers[postgres]>=4", "psycopg[binary]>=3.1"]

[tool.setuptools]
py-modules = ["__init__", "cli", "health", "importer", "backup"]

[tool.pytest.ini_options]
testpaths = ["tests"]
