[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-prospecta"
version = "0.1.0"
description = "Prospecta memory provider plugin for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge ⚒️", email = "forge@witt3rd.com" }]
requires-python = ">=3.11"
dependencies = [
    # Pinned to main@c52a126: the hybrid search and RAG library (Stage 1 hybrid_chunk, Stage 2
    # cross_encoder, cited evidence, excluded_sources / date_from / date_to on search, ask() with the
    # Stage 3 gate, chunk-only retain() that stamps created_on). The pin that came before it was
    # e863ac1 (schema migration 0003, env-selectable embedder). The live bank DB migrates on
    # initialize (run_migrations).
    # [defaults] = LiteLLM (LLM + default embedder); [embed-sentence-transformers]
    # is declared here, not optional, so a venv rebuild cannot drop the local embedder.
    "prospecta[defaults,embed-sentence-transformers] @ git+https://github.com/witt3rd/prospecta.git@c52a126e5fc08e495ac94e8a48e636bdbd24a8ef",
    "psycopg[binary]>=3.1",
]

[project.scripts]
hermes-prospecta-health = "health:main"
hermes-prospecta-backup = "backup:backup_main"
hermes-prospecta-restore = "backup:restore_main"
hermes-prospecta-fill-note-dates = "fill_note_dates:main"

[project.optional-dependencies]
test = ["pytest>=7", "testcontainers[postgres]>=4", "psycopg[binary]>=3.1"]

[tool.setuptools]
py-modules = ["__init__", "cli", "health", "importer", "backup", "fill_note_dates", "abstention", "date_cue_gate", "prefetch_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
