[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-prospecta"
version = "0.1.0"
description = "Prospecta memory provider plugin for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge ⚒️", email = "forge@witt3rd.com" }]
requires-python = ">=3.11"
dependencies = [
    # Pinned to main@736bd28: the hybrid search and RAG library with Mode 1, automatic recall by query
    # expansion (Memory.expand_and_recall, witt3rd/prospecta PR 85), which the contract prefetch calls;
    # Stage 1 hybrid_chunk, Stage 2 cross_encoder, cited evidence, excluded_sources / date_from / date_to,
    # ask() with the Stage 3 gate, chunk-only retain() that stamps created_on. The pin before it was
    # c52a126. Bump to a later commit only with a test run against it. The live bank DB migrates on
    # initialize (run_migrations).
    # [defaults] = LiteLLM (LLM + default embedder); [embed-sentence-transformers]
    # is declared here, not optional, so a venv rebuild cannot drop the local embedder.
    "prospecta[defaults,embed-sentence-transformers] @ git+https://github.com/witt3rd/prospecta.git@736bd28a443ecb174f300a8eac5986680cff0ba3",
    "psycopg[binary]>=3.1",
]

[project.scripts]
hermes-prospecta-health = "health:main"
hermes-prospecta-backup = "backup:backup_main"
hermes-prospecta-restore = "backup:restore_main"
hermes-prospecta-fill-note-dates = "fill_note_dates:main"

[project.optional-dependencies]
test = ["pytest>=7", "testcontainers[postgres]>=4", "psycopg[binary]>=3.1"]

[tool.setuptools]
py-modules = ["__init__", "cli", "health", "importer", "backup", "fill_note_dates", "abstention", "date_cue_gate", "prefetch_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
