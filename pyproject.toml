[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-prospecta"
version = "0.1.0"
description = "Prospecta memory provider plugin for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge ⚒️", email = "forge@witt3rd.com" }]
requires-python = ">=3.11"
dependencies = [
    # Pinned to main@67c0706: the hybrid search and RAG library with Mode 1 automatic recall by query
    # expansion (Memory.expand_and_recall), which the contract prefetch calls. This pin carries
    # new-bank defaults (witt3rd/prospecta PR 86), the terms filter and meaning near-copy merge
    # (PR 87), and the docs overhaul (PR 88). The pin before it was 736bd28. Bump to a later
    # commit only with a test run against it. The live bank DB migrates on
    # initialize (run_migrations).
    # [defaults] = LiteLLM (LLM + default embedder); [embed-sentence-transformers]
    # is declared here, not optional, so a venv rebuild cannot drop the local embedder.
    "prospecta[defaults,embed-sentence-transformers] @ git+https://github.com/witt3rd/prospecta.git@67c0706ae20ff638bc0d7d37de270a2743951e2d",
    "psycopg[binary]>=3.1",
]

[project.scripts]
hermes-prospecta-health = "health:main"
hermes-prospecta-backup = "backup:backup_main"
hermes-prospecta-restore = "backup:restore_main"
hermes-prospecta-fill-note-dates = "fill_note_dates:main"

[project.optional-dependencies]
test = ["pytest>=7", "testcontainers[postgres]>=4", "psycopg[binary]>=3.1"]

[tool.setuptools]
py-modules = ["__init__", "cli", "health", "importer", "backup", "fill_note_dates", "abstention", "date_cue_gate", "prefetch_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
