[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-prospecta"
version = "0.1.0"
description = "Prospecta memory provider plugin for Hermes Agent"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Forge ⚒️", email = "forge@witt3rd.com" }]
requires-python = ">=3.11"
dependencies = [
    # Pinned to main@fe68efd: the hybrid search and RAG library after the removal of all remaining legacy
    # (witt3rd/prospecta PR 90): one read path (Stage 1 hybrid_chunk + Stage 2 cross-encoder), Mode 1
    # expansion (Memory.expand_and_recall), Mode 2A search, Mode 2B ask (Memory.ask, which prospecta_recall
    # calls) and Stage 3; a chunk-only write path (retain takes no index_text / child_chunks); no
    # recall_synth, no search(mode=), no linker. The pin before it was 4e2962d. It is re-pointed to the tag
    # v1.0.0 once the release exists. Bump to a later commit only with a test run against it. The
    # live bank DB migrates on initialize (run_migrations).
    # [defaults] = LiteLLM (LLM + default embedder); [embed-sentence-transformers]
    # is declared here, not optional, so a venv rebuild cannot drop the local embedder.
    "prospecta[defaults,embed-sentence-transformers] @ git+https://github.com/witt3rd/prospecta.git@fe68efdac7d12e4208afb3019a30fe7284509a96",
    "psycopg[binary]>=3.1",
]

[project.scripts]
hermes-prospecta-health = "health:main"
hermes-prospecta-backup = "backup:backup_main"
hermes-prospecta-restore = "backup:restore_main"
hermes-prospecta-fill-note-dates = "fill_note_dates:main"

[project.optional-dependencies]
test = ["pytest>=7", "testcontainers[postgres]>=4", "psycopg[binary]>=3.1"]

[tool.setuptools]
py-modules = ["__init__", "cli", "health", "importer", "backup", "fill_note_dates", "abstention", "prefetch_contract"]

[tool.pytest.ini_options]
testpaths = ["tests"]
