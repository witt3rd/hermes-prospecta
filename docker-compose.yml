services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: prospecta
      POSTGRES_USER: prospecta
    ports:
      - "${PROSPECTA_EMBEDDED_PORT:-5432}:5432"
    volumes:
      - prospecta_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prospecta"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  prospecta_pgdata:
